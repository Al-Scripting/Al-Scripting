name: Persona card

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/persona_card.py"
      - ".github/workflows/persona-card.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script is dependency-free on purpose, so there is nothing to install.
      # METRICS_TOKEN (if present) also sees private and org repos; the default
      # GITHUB_TOKEN covers everything public, so the card renders either way.
      - name: Render the persona card
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/persona_card.py --user Al-Scripting --out persona-card.svg

      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The timestamp changes every run, so only commit when a weight or a
          # stat actually moved. Otherwise this would push a commit every day
          # purely to rewrite the footer.
          if git diff --quiet -I'UTC</text>' -- persona-card.svg; then
            echo "no meaningful change"
            git checkout -- persona-card.svg || true
          else
            git add persona-card.svg
            git commit -m "chore: refresh persona card"
            git push
          fi
