name: GitHub metrics

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # The wide dashboard: identity, repo stats, and the isometric contribution calendar.
  overview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Al-Scripting
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

  # The second card: when he actually codes, and what he reaches for.
  habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Al-Scripting
          filename: metrics.habits.svg
          template: classic
          base: ""
          config_timezone: America/Toronto

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_threshold: 0%
          plugin_habits_trim: yes

          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          plugin_stargazers: yes
          plugin_stargazers_charts: yes

  # The portfolio card: pinned work and the live site's Lighthouse score.
  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Al-Scripting
          filename: metrics.showcase.svg
          template: classic
          base: ""
          config_timezone: America/Toronto

          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
          plugin_pagespeed_url: https://al-scripting.github.io/about-me/

          plugin_repositories: yes
          plugin_repositories_pinned: 6

          plugin_lines: yes
          plugin_lines_sections: base
