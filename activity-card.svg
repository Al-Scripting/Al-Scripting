<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312"
     viewBox="0 0 900 312" role="img"
     aria-label="Live GitHub activity for Al-Scripting">
  <title>Al-Scripting — live GitHub activity</title>
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .frame { fill: #0D1117; stroke: #E5484D; stroke-opacity: 0.5; stroke-width: 1.5; }
    .chrome { fill: #161B22; }
    .title { fill: #E5484D; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
    .sub { fill: #8B949E; font-size: 10.5px; letter-spacing: 0.4px; }
    .label { fill: #E6EDF3; font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .signal { fill: #8B949E; font-size: 9.5px; }
    .score { fill: #E5484D; font-size: 11.5px; font-weight: 700; }
    .track { fill: #21262D; }
    .fill { fill: url(#grad); }
    .spark-line { fill: none; stroke: #E5484D; stroke-width: 1.6; stroke-linejoin: round; }
    .spark-area { fill: url(#fade); }
    .spark-dot { fill: #E5484D; }
    .glabel { fill: #8B949E; font-size: 9px; letter-spacing: 0.6px; }
    .foot { fill: #8B949E; font-size: 9.5px; }
    .accent { fill: #E5484D; font-size: 9.5px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E2429"/>
      <stop offset="100%" stop-color="#E5484D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0"/>
    </linearGradient>
  </defs>

