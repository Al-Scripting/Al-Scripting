    <text x="148" y="246" class="signal">24 PRs · 7 issues · 0 reviews</text>
    <rect x="360" y="236" width="340" height="12" rx="6" class="track"/>
    <rect x="360" y="236" width="125.2" height="12" rx="6" class="fill">
      <animate attributeName="width" from="0" to="125.2"
