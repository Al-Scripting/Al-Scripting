<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312"
     viewBox="0 0 900 312" role="img"
     aria-label="Live GitHub activity for Al-Scripting">
  <title>Al-Scripting — live GitHub activity</title>
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .frame { fill: #F4EBDA; stroke: #BC2D29; stroke-opacity: 0.85; stroke-width: 2; }
    .chrome { fill: #EAE0C9; }
    .kacc { fill: #BC2D29; font-size: 15px; font-weight: 700;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    .title { fill: #BC2D29; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
    .sub { fill: #8C7B66; font-size: 10.5px; letter-spacing: 0.4px; }
    .label { fill: #2B2320; font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .signal { fill: #8C7B66; font-size: 9.5px; }
    .score { fill: #BC2D29; font-size: 11.5px; font-weight: 700; }
    .track { fill: #E3D5B8; }
    .fill { fill: url(#grad); }
    .spark-line { fill: none; stroke: #BC2D29; stroke-width: 1.6; stroke-linejoin: round; }
    .spark-area { fill: url(#fade); }
    .spark-dot { fill: #BC2D29; }
    .glabel { fill: #8C7B66; font-size: 9px; letter-spacing: 0.6px; }
    .foot { fill: #8C7B66; font-size: 9.5px; }
    .accent { fill: #BC2D29; font-size: 9.5px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E1F1D"/>
      <stop offset="100%" stop-color="#BC2D29"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BC2D29" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#BC2D29" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="310" rx="12" class="frame"/>
  <path d="M1 13 a12 12 0 0 1 12-12 h874 a12 12 0 0 1 12 12 v19 h-898 z" class="chrome"/>
  <circle cx="24" cy="17" r="4.5" fill="#BC2D29"/>
  <circle cx="40" cy="17" r="4.5" fill="#CDBC9C"/>
  <circle cx="56" cy="17" r="4.5" fill="#CDBC9C"/>
  <text x="450.0" y="21" class="sub" text-anchor="middle">al@oshawa: ~/activity --live</text>

