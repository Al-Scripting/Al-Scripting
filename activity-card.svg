    .spark-dot { fill: #c43d2b; }
    .glabel { fill: #3d4250; font-size: 9px; letter-spacing: 0.6px; }
    .foot { fill: #3d4250; font-size: 9.5px; }
    .accent { fill: #c43d2b; font-size: 9.5px; font-weight: 700; }
  </style>
