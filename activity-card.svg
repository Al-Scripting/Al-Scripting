  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .title { fill: #1c1a17; font-size: 18px; font-weight: 800; letter-spacing: 4px; }
    .kanji { fill: #c43d2b; font-size: 15px; letter-spacing: 3px; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
