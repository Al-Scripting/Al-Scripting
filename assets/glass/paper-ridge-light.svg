<text x="32" y="212.0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1a17" opacity="0.85">One PPO agent blends four persona rewards from the</text><text x="32" y="230.0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1a17" opacity="0.85">game state. The only condition that reaches both</text><text x="32" y="248.0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1a17" opacity="0.85">wood-tier branches on Crafter.</text>
