    .spark-dot { fill: #ff8a6e; }
    .glabel { fill: #d4cfc6; font-size: 9px; letter-spacing: 0.6px; }
    .foot { fill: #d4cfc6; font-size: 9.5px; }
    .accent { fill: #ff8a6e; font-size: 9.5px; font-weight: 700; }
  </style>
