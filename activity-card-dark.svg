    .track { fill: #fff; fill-opacity: 0.1; stroke: #fff; stroke-opacity: 0.15; }
    .fill { fill: url(#grad); }
    .spark-line { fill: none; stroke: #ff8a6e; stroke-width: 1.6; stroke-linejoin: round; }
