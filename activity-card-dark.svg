  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .title { fill: #f5f1ea; font-size: 18px; font-weight: 800; letter-spacing: 4px; }
    .kanji { fill: #ff8a6e; font-size: 15px; letter-spacing: 3px; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
