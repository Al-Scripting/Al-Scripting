<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318"
     role="img" aria-label="AL Shifan — breaks networks on purpose, then teaches AI to fix them">
  <title>AL Shifan</title>
  <defs>
    <radialGradient id="glow" cx="18%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", "Courier New", ui-monospace, monospace; }
    .frame { fill: #0D1117; stroke: #E5484D; stroke-opacity: 0.55; stroke-width: 1.5; }
    .chrome { fill: #1A0E10; }
    .path { fill: #8B949E; font-size: 11px; }
    .name { fill: #E6EDF3; font-size: 46px; font-weight: 700; letter-spacing: 7px; }
    .accent { fill: #E5484D; }
    .tag { fill: #E5484D; fill-opacity: 0.85; font-size: 13px; letter-spacing: 1.6px; }
    .prompt { fill: #E5484D; font-size: 13px; }
    .out { fill: #E6EDF3; fill-opacity: 0.82; font-size: 13px; }
  </style>

  <rect x="1" y="1" width="898" height="316" rx="14" class="frame"/>
  <rect x="1" y="1" width="898" height="316" rx="14" fill="url(#glow)"/>
  <path d="M1 15 a14 14 0 0 1 14-14 h870 a14 14 0 0 1 14 14 v25 h-898 z" class="chrome"/>
  <circle cx="28" cy="21" r="5" fill="#E5484D"/>
  <circle cx="46" cy="21" r="5" fill="#3D444D"/>
  <circle cx="64" cy="21" r="5" fill="#3D444D"/>
  <text x="450.0" y="26" class="path" text-anchor="middle">al@oshawa: ~/profile</text>

  <text x="40" y="108" class="name">AL <tspan class="accent">SHIFAN</tspan></text>
  <text x="40" y="140" class="tag">&lt;/&gt; breaks networks on purpose, then teaches AI to fix them</text>

  <text x="40" y="196" class="prompt" opacity="1">al@oshawa:~$ cat ./stack.txt<animate attributeName="opacity"
    from="0" to="1" dur="0.28s" begin="0.35s" fill="freeze"/></text>
  <text x="40" y="218" class="out" opacity="1">&gt; Python &#183; P4 &#183; Cisco &#183; PyTorch &#183; JS  //  from packets to policies to pixels<animate attributeName="opacity"
    from="0" to="1" dur="0.28s" begin="0.75s" fill="freeze"/></text>
  <text x="40" y="250" class="prompt" opacity="1">al@oshawa:~$ ./ship --recent<animate attributeName="opacity"
    from="0" to="1" dur="0.28s" begin="1.15s" fill="freeze"/></text>
  <text x="40" y="272" class="out" opacity="1">&gt; [pub] RIDGE &#8212; accepted @ IEEE CoG 2026, Madrid<animate attributeName="opacity"
    from="0" to="1" dur="0.28s" begin="1.55s" fill="freeze"/></text>
  <text x="40" y="300" class="prompt">al@oshawa:~$ <tspan>_<animate attributeName="opacity"
    values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/></tspan></text>
</svg>
