name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution graph as a snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#BC2D29&color_dots=#F4EBDA,#E6D5B4,#D4B58C,#C77A6B,#BC2D29
            dist/github-snake-dark.svg?color_snake=#F4EBDA&color_dots=#262019,#553028,#7E352C,#A0322C,#BC2D29

      - name: Push the rendered SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
